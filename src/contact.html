<body>
<header class="site-header">
  <div class="bar">
    <a class="wordmark" href="/">ZWrld</a>
{{NAV}}
  </div>
</header>
<main>
  <section class="section section-first" aria-labelledby="contact-h">
    <p class="kicker">Contact</p>
    <h2 id="contact-h">Get in touch</h2>
    <p class="blurb">Booking, press, radio, or just a hello. Every message is read.</p>
    <form class="form" name="contact" method="POST" action="/thanks.html" data-netlify="true" data-netlify-honeypot="bot-field" netlify>
      <input type="hidden" name="form-name" value="contact">
      <p class="hp"><label>Don&rsquo;t fill this out if you&rsquo;re human: <input name="bot-field"></label></p>
      <label for="f-name">Your name</label>
      <input id="f-name" name="name" type="text" autocomplete="name" required>
      <label for="f-email">Your email</label>
      <input id="f-email" name="email" type="email" autocomplete="email" required>
      <label for="f-reason">Reason</label>
      <select id="f-reason" name="reason" required>
        <option value="" disabled selected>Choose one</option>
        <option>Booking</option>
        <option>Press</option>
        <option>Radio</option>
        <option>Fan mail</option>
        <option>Other</option>
      </select>
      <label for="f-message">Message</label>
      <textarea id="f-message" name="message" rows="6" required></textarea>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
    <p class="small">Or email directly: <a href="mailto:{{BOOKING_EMAIL}}">{{BOOKING_EMAIL}}</a></p>
  </section>
</main>
<footer class="footer">
  <div class="footer-inner">
    <a class="wordmark small-mark" href="/">ZWrld</a>
    <nav class="footer-nav" aria-label="Footer"><a href="/">Home</a><a href="/about.html">About</a><a href="/newsletter/">Newsletter</a><a href="/contact.html">Contact</a></nav>
    <p class="copy">&copy; 2026 ZWrld &middot; <a href="mailto:{{BOOKING_EMAIL}}">{{BOOKING_EMAIL}}</a></p>
  </div>
</footer>
</body>
</html>
